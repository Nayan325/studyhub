<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Content - StudyHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h2>StudyHub</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

    </header>


    <main class="upload-page">

        <div class="upload-card">

            <h1>Upload Study Material 📚</h1>

            <p class="upload-subtitle">
                Share useful study material with other students.
            </p>


            <form id="uploadForm">

                <div class="form-group">

                    <label for="title">
                        Content Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. DBMS Unit 1 Notes"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="e.g. DBMS"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe this study material..."
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="file">
                        Select File
                    </label>

                    <input
                        type="file"
                        id="file"
                        accept=".pdf,.mp4,.webm"
                        required
                    >

                    <small>
                        Supported formats: PDF, MP4, WEBM
                    </small>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Upload Content
                </button>

            </form>


            <p id="uploadMessage"></p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 StudyHub. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
